name: Learning Lab CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Challenge suites use describe.skip until the learner activates them.
      # CI checks the scaffold, not whether the learner has solved every lab.
